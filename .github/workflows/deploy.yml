name: deploy

on:
  push:
    branches: [main]
  # export.yml dispatches this after committing a new export: pushes made with
  # GITHUB_TOKEN do not trigger other workflows on their own.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
      PUBLIC_AUTH_CODE: ${{ vars.PUBLIC_AUTH_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # build.test.ts runs its own astro build; the real build follows. The glob form
      # is needed: a bare "build.test.ts" does not match tests-js/build.test.ts.
      - run: npx vitest run tests-js --exclude '**/build.test.ts'
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
